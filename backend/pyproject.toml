# Метаданные проекта: версия синхронизирована с релизным тегом (v2.0.0).
# Зависимости живут в requirements.txt / requirements-dev.txt (Docker-сборка и
# локальный запуск читают именно их), здесь — только то, что нужно для версии и
# инструментов.
[project]
name = "presentation-designer-backend"
version = "2.0.0"
description = "Цифровой дизайнер презентаций: генерация колоды по брифу на произвольном PPTX-шаблоне"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
