# Явное имя проекта: не зависит от имени каталога (в т.ч. кириллического),
# поэтому `docker compose up` работает из любой папки
name: digital-designer

services:
  # Локальный инференс LLM/VLM/эмбеддингов. Платные API не используются (ADR-001).
  ollama:
    image: ollama/ollama:latest
    container_name: dp-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # первый запуск скачивает модели (несколько ГБ); маркер /tmp/models-ready
    # создаётся в любом случае, чтобы офлайн-режим тоже стартовал
    entrypoint:
      - /bin/sh
      - -c
      - >-
        ollama serve &
        sleep 5 &&
        (ollama pull qwen2.5:7b-instruct || true) &&
        (ollama pull qwen2.5-vl:7b-instruct || true) &&
        touch /tmp/models-ready &&
        wait
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 && test -f /tmp/models-ready"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dp-backend
    depends_on:
      ollama:
        condition: service_healthy
    # Секреты и настройки провайдера берём из локального .env на этапе запуска
    # (в самом compose-файле ключей нет, `docker compose config` их не покажет).
    # Значения из `environment` ниже имеют приоритет над файлом.
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DISABLE_LLM: "false"
      CORS_ORIGINS: "http://localhost:3000"
      # абсолютный путь: каталог данных один и тот же при любом рабочем каталоге
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      # задания, контент-пакеты и кэш миниатюр переживают перезапуск контейнера
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    # контекст — корень репозитория: так работает общий .dockerignore
    # и путь COPY frontend/... внутри Dockerfile
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dp-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
